<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add review - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/addReview.js"></script>
  </head>

  <body>
    <main class="container py-4">
      <a href="./reviews.html" class="text-dark d-inline-block mb-3" aria-label="Back to reviews">
        <i class="bi bi-chevron-left fs-2" aria-hidden="true"></i>
      </a>

      <h1 class="h3 text-uppercase mb-4">Add review</h1>

      <!-- Step 1: pick a book (from your library or searched in Google Books) -->
      <div id="bookPicker">
        <form id="searchForm" class="input-group mb-2">
          <input
            id="bookSearch"
            type="search"
            class="form-control"
            placeholder="Search a book: title, author or ISBN"
            aria-label="Search for a book"
            required
          />
          <button class="btn btn-primary" type="submit">Search</button>
        </form>
        <div id="searchStatus" class="small text-secondary mb-2" role="status"></div>
        <div id="bookResults" class="list-group mb-4"></div>
      </div>

      <!-- Step 2: stars and comment appear once a book is chosen -->
      <form id="reviewForm" hidden>
        <fieldset id="reviewFields">
          <div class="d-flex gap-3 align-items-center mb-4">
            <div id="selectedCover"></div>
            <div class="flex-grow-1">
              <div id="selectedTitle" class="fw-semibold fs-5 text-break"></div>
              <div id="selectedAuthors" class="small text-secondary text-break"></div>
            </div>
            <button id="changeBook" type="button" class="btn btn-outline-secondary btn-sm">
              Change
            </button>
          </div>

          <div class="mb-3">
            <span class="form-label d-block" id="ratingLabel">Rating</span>
            <div id="starInput" role="group" aria-labelledby="ratingLabel"></div>
          </div>

          <div class="mb-3">
            <label for="commentInput" class="form-label text-uppercase fs-5">Add comment</label>
            <textarea
              id="commentInput"
              class="form-control bg-secondary-subtle border-0"
              rows="10"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <button id="saveReview" type="submit" class="btn btn-primary">Save</button>
        </fieldset>
      </form>

      <p id="addMessage" class="mt-3 mb-0" role="status" aria-live="polite"></p>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
