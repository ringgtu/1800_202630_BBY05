<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add review - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/addReview.js"></script>
  </head>

  <body>
    <main class="container py-4">
      <a href="./reviews.html" class="text-dark d-inline-block mb-3" aria-label="Back to reviews">
        <i class="bi bi-chevron-left fs-2" aria-hidden="true"></i>
      </a>

      <form id="reviewForm">
        <fieldset id="reviewFields" disabled>
          <h1 class="h3 text-uppercase mb-4">Add review</h1>

          <div class="mb-3">
            <label for="bookSelect" class="form-label">Book</label>
            <select id="bookSelect" class="form-select" required>
              <option value="">Choose a book…</option>
            </select>
          </div>

          <div class="mb-3">
            <span class="form-label d-block" id="ratingLabel">Rating</span>
            <div id="starInput" role="group" aria-labelledby="ratingLabel"></div>
          </div>

          <div class="mb-3">
            <label for="commentInput" class="form-label text-uppercase fs-5">Add comment</label>
            <textarea
              id="commentInput"
              class="form-control bg-secondary-subtle border-0"
              rows="10"
              maxlength="2000"
              required
            ></textarea>
          </div>

          <button id="saveReview" type="submit" class="btn btn-primary">Save</button>
        </fieldset>
        <p id="addMessage" class="mt-3 mb-0" role="status" aria-live="polite">Loading books…</p>
      </form>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
