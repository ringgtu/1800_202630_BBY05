<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book info</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/bookapi.js"></script>
    <script type="module" src="/src/addToList.js"></script>
    <script type="module" src="/src/backLink.js"></script>
  </head>
  <body class="position-relative m-5">
    <a href="/html/search.html" id="back-link" class="text-reset text-decoration-none">
      <i class="bi bi-caret-left fs-1"></i>
    </a>
    <br />
    <br />
    <!-- Book cover -->
    <div class="d-flex justify-content-center align-items-center">
      <figure class="figure text-center">
        <img id="cover" src="/images/image.png" class="figure-img img-fluid rounded" alt="book cover" style="width: 240px; aspect-ratio: 2 / 3; object-fit: cover" /> 
        <figcaption class="figure-caption">
          <div class="fw-bold text-dark fs-1" id="title">Book</div>
          <div class="text-muted fs-4" id="author">By Author</div>
        </figcaption>
      </figure>
    </div>

    <hr />

    <!-- Review section -->
    <ul class="list-group list-group-horizontal d-flex justify-content-center">
      <li class="list-group-item">
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-half"></i>
        <i class="bi bi-star"></i>
        <i class="bi bi-star"></i>
        3.5
      </li>
      <li class="list-group-item">47,090 ratings</li>
      <li class="list-group-item">7,067 reviews</li>
    </ul>
    <hr />
    <div class="d-flex justify-content-around">
      <button type="button" class="btn btn-secondary" id="add-to-list" data-bs-toggle="modal" data-bs-target="#addToListModal">Add to list</button>
      <button type="button" class="btn btn-secondary" id="whereToBuyBtn">Where to buy</button>
    </div>
    <hr />
    <!-- Details -->
    <div class="list-group">
      <div class="list-group-item p-3">
        <h5 class="mb-2">Summary</h5>
        <div class="mb-1 text-secondary" id="summary">
          Lorem ipsum dolor sit amet consectetur. Viverra facilisi sagittis etiam facilisi tristique vitae a rutrum
          porta...
        </div>
      </div>
      <div id="whereToBuySection" class="list-group-item p-3">
        <h5 class="mb-3">Where to buy</h5>
        <div id="retailerList" class="d-flex flex-column gap-2">
          <p class="text-muted small mb-0">Loading retailer options…</p>
        </div>
      </div>
    </div>

    <!-- Add list popup -->
    <div class="modal fade" id="addToListModal" tabindex="-1" aria-labelledby="addToListTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="addToListTitle">Add to list</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
              <p id="addToListMessage" class="mb-0" role="status" aria-live="polite"></p>
              <button id="newListToggle" type="button" class="btn btn-secondary btn-sm flex-shrink-0" disabled>
                <i class="bi bi-plus-lg"></i> New list
              </button>
            </div>

            <form id="newListInline" class="input-group mb-2" hidden>
              <input
                type="text"
                id="newListInlineName"
                class="form-control"
                placeholder="List name"
                aria-label="List name"
                maxlength="50"
                required />
              <button id="newListInlineCreate" type="submit" class="btn btn-secondary">Create</button>
            </form>

            <div id="addToListOptions" class="list-group"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
