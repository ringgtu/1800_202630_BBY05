<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book info</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/bookapi.js"></script>
  </head>
  <body class="position-relative m-5">
    <a href="/html/search.html" class="text-reset text-decoration-none">
      <i class="bi bi-caret-left fs-1"></i>
    </a>
    <br />
    <br />
    <!-- Book cover -->
    <div class="d-flex justify-content-center align-items-center">
      <figure class="figure text-center">
        <img id="cover" src="/images/image.png" class="figure-img img-fluid rounded" alt="..." />
        <figcaption class="figure-caption">
          <div class="fw-bold text-dark fs-1" id="title">Book</div>
          <div class="text-muted fs-4" id="author">By Author</div>
        </figcaption>
      </figure>
    </div>

    <hr />

    <!-- Review section -->
    <ul class="list-group list-group-horizontal d-flex justify-content-center">
      <li class="list-group-item">
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-fill"></i>
        <i class="bi bi-star-half"></i>
        <i class="bi bi-star"></i>
        <i class="bi bi-star"></i>
        3.5
      </li>
      <li class="list-group-item">47,090 ratings</li>
      <li class="list-group-item">7,067 reviews</li>
    </ul>
    <hr />
    <div class="d-flex justify-content-around">
      <button type="button" class="btn btn-secondary" id="test">Add to list</button>
      <button type="button" class="btn btn-secondary" id="whereToBuyBtn">Where to buy</button>
    </div>
    <hr />
    <!-- Details -->
    <div class="list-group">
      <div class="list-group-item p-3">
        <h5 class="mb-2">Summary</h5>
        <div class="mb-1 text-secondary" id="summary">
          Lorem ipsum dolor sit amet consectetur. Viverra facilisi sagittis etiam facilisi tristique vitae a rutrum
          porta...
        </div>
      </div>
      <div id="whereToBuySection" class="list-group-item p-3">
        <h5 class="mb-3">Where to buy</h5>
        <div id="retailerList" class="d-flex flex-column gap-2">
          <p class="text-muted small mb-0">Loading retailer options…</p>
        </div>
      </div>
    </div>
  </body>
</html>
