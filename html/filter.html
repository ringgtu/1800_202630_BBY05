<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Filter</title>

    <script type="module" src="/src/main.js"></script>
    <!-- NEW: carries the search keyword through this page -->
    <script type="module" src="/src/keepParams.js"></script>
  </head>

  <body>
    <main class="container py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center mb-5">
            <h1 class="h5 mb-0">Filter By</h1>

            <a href="search.html" id="close-link" class="btn-close" aria-label="Close"></a>
          </div>


          <form action="filtered.html" data-owns="genre,tag">
            <h2 class="h6 mt-4 mb-3">Genres</h2>
            <div class="row row-cols-3 g-2">

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-fiction" name="genre" value="Fiction" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-fiction">Fiction</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-fantasy" name="genre" value="Fantasy" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-fantasy">Fantasy</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-romance" name="genre" value="Romance" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-romance">Romance</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-mystery" name="genre" value="Mystery" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-mystery">Mystery</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-history" name="genre" value="History" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-history">History</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="genre-science" name="genre" value="Science" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="genre-science">Science</label>
              </div>
            </div>

            <br /><br />

            <h2 class="h6 mt-4 mb-3">Tags</h2>
            <div class="row row-cols-3 g-2">

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-1" name="tag" value="Classic" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-1">Classic</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-2" name="tag" value="Bestseller" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-2">Bestseller</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-3" name="tag" value="Teen" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-3">Teen</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-4" name="tag" value="Race" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-4">Race</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-5" name="tag" value="Indigenous" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-5">Indigenous</label>
              </div>

              <div class="col d-grid">
                <input type="checkbox" class="btn-check" id="tag-6" name="tag" value="Game" autocomplete="off" />
                <label class="btn btn-outline-secondary rounded-pill fw-normal px-3 py-2" for="tag-6">Game</label>
              </div>
            </div>

            <!-- Apply Button-->
            <div class="d-grid mt-5 px-4">
              <button type="submit" class="btn btn-secondary btn-lg rounded-pill">Apply</button>
            </div>

          </form>
        </div>
      </div>

    </main>

  </body>
</html>
