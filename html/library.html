<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Library - Book Organization App</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/src/library.js"></script>
  </head>
  <body>
    <div class="container text-center py-3 px-5">
      <h1 class="h4 mb-0" id="heading" style="color: var(--primary)">My Library</h1>
      <small class="opacity-75" id="hint" aria-live="polite"></small>
    </div>

    <!-- Top right: search my library, and Add book -->
    <div class="top-bar">
      <div class="top-bar-search d-none" id="searchBox">
        <div class="input-group">
          <span class="input-group-text bg-secondary-subtle border-0"><i class="bi bi-search"></i></span>
          <input
            type="search"
            id="librarySearch"
            class="form-control bg-secondary-subtle border-0"
            placeholder="Search my library"
            aria-label="Search my library"
            autocomplete="off" />
        </div>
        <div class="list-group position-absolute end-0 mt-1 d-none" id="searchResults" aria-live="polite"></div>
      </div>

      <a href="./addbook.html" class="btn btn-add d-none" id="addBtn" aria-label="Add book">
        <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline ms-1">Add book</span>
      </a>
    </div>

    <!-- 3D Book Stage: previous book | current book | next book -->
    <div class="stage d-none" id="stage">
      <div class="shelf" id="shelf">
        <button type="button" class="side-book side-prev is-empty" id="sidePrev" tabindex="-1"></button>
        <div class="book" id="book"></div>
        <button type="button" class="side-book side-next is-empty" id="sideNext" tabindex="-1"></button>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls mx-auto d-flex justify-content-between align-items-center px-3 pb-3 d-none" id="controls">
      <button class="btn btn-book" id="prev">&larr; Previous book</button>
      <span id="label" class="small opacity-75" aria-live="polite"></span>
      <button class="btn btn-book" id="next">Next book &rarr;</button>
    </div>

    <!-- Reviews & Delete -->
    <div class="d-flex justify-content-center gap-3 pb-3 d-none" id="reviewsContainer">
      <a href="./reviews.html" class="btn btn-book" id="reviewsBtn">Reviews</a>
      <button class="btn btn-cancel" id="deleteBtn" type="button">
        <i class="bi bi-trash"></i> Remove
      </button>
    </div>

    <!-- Bottom Navigation Bar -->
    <site-navbar></site-navbar>
  </body>
</html>
