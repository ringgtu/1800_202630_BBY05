<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Library - Book Organization App</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <script type="module" src="/src/library.js"></script>
  </head>
  <body>
    <div class="container text-center py-3 px-5">
      <h1 class="h4 mb-0" id="heading" style="color: var(--primary)">My Library</h1>
      <small class="opacity-75" id="hint"></small>
    </div>

    <!-- 3D Book Stage -->
    <div class="stage">
      <div class="shelf" id="shelf">
        <div class="book" id="book"></div>
      </div>
    </div>

    <!-- Navigation Controls -->
    <div class="controls mx-auto d-flex justify-content-between align-items-center px-3 pb-3">
      <button class="btn btn-book" id="prev">&larr; Previous book</button>
      <span id="label" class="small opacity-75"></span>
      <button class="btn btn-book" id="next">Next book &rarr;</button>
    </div>

    <!-- Reviews Link -->
    <div class="text-center pb-3">
      <a href="./reviews.html" class="btn btn-book">Reviews</a>
    </div>

    <!-- Add Book Button: fixed top right -->
    <button
      type="button"
      class="btn btn-add add-fixed d-none"
      id="addBtn"
      data-bs-toggle="modal"
      data-bs-target="#addModal"
      aria-label="Add book">
      <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline ms-1">Add book</span>
    </button>

    <!-- Add Book Modal -->
    <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="addModalLabel">Add a book</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="searchForm" class="input-group mb-3">
              <input
                type="text"
                id="searchInput"
                class="form-control"
                placeholder="Title, author or ISBN"
                aria-label="Search for a book"
                required />
              <button class="btn btn-add" type="submit">Search</button>
            </form>
            <div id="searchStatus" class="small mb-2" role="status"></div>
            <div id="results" class="list-group mb-3"></div>
            <div id="noteBox" class="d-none">
              <label for="noteInput" class="form-label fw-semibold">Your note</label>
              <textarea
                id="noteInput"
                class="form-control"
                rows="3"
                maxlength="500"
                placeholder="Why are you adding this book? (optional)"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-cancel" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-add" id="saveBtn" disabled>Save book</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <site-navbar></site-navbar>
  </body>
</html>
