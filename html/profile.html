<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/profile.js"></script>
  </head>

  <body>
    <main class="container py-5">
      <!-- Profile information -->
      <section id="profileCard" class="bg-secondary-subtle rounded-4 p-3">
        <!-- Back to the profile page (shown only when your full profile is open) -->
        <button
          id="backToProfile"
          type="button"
          class="btn btn-link text-decoration-none px-0 mb-2"
          hidden
        >
          <i class="bi bi-arrow-left" aria-hidden="true"></i> Back
        </button>

        <div class="d-flex align-items-start justify-content-between gap-3">
          <!-- Select this to open your full profile -->
          <div
            id="profileSummary"
            class="d-flex align-items-center gap-4 flex-grow-1"
            role="button"
            tabindex="0"
            aria-label="Open my profile"
          >
            <i
              class="bi bi-person-circle display-1 text-secondary"
              aria-hidden="true"
            ></i>

            <div>
              <h1 id="profileName" class="h4">My profile</h1>
              <p id="profileEmail" class="mb-0 text-break"></p>
              <small id="profileHint" class="text-secondary" hidden>
                Select to view your profile
              </small>
            </div>
          </div>

          <!-- Arrow on the profile page, Edit button once the profile is open -->
          <i
            id="profileChevron"
            class="bi bi-chevron-right fs-3 text-secondary align-self-center"
            aria-hidden="true"
            hidden
          ></i>
          <button
            id="editProfile"
            type="button"
            class="btn btn-outline-primary btn-sm"
            hidden
          >
            Edit
          </button>
        </div>

        <!-- VIEW: all current info as plain text -->
        <div id="profileView" class="mt-4" hidden>
          <p class="mb-2">
            <strong>Name:</strong> <span id="viewName"></span>
          </p>
          <p class="mb-2">
            <strong>Country:</strong> <span id="viewCountry"></span>
          </p>
          <p class="mb-0">
            <strong>Reader identity:</strong> <span id="viewIdentity"></span>
          </p>
        </div>

        <!-- EDIT: same info, now editable -->
        <form id="profileForm" class="mt-4" hidden>
          <fieldset id="profileFields" disabled>
            <legend class="h5">Edit your details</legend>

            <div class="mb-3">
              <label for="nameInput" class="form-label">Name</label>
              <input
                type="text"
                id="nameInput"
                class="form-control"
                autocomplete="name"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label for="countryInput" class="form-label">Country</label>
              <input
                type="text"
                id="countryInput"
                class="form-control"
                autocomplete="country-name"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label for="identityInput" class="form-label">Reader identity</label>
              <input
                type="text"
                id="identityInput"
                class="form-control"
                placeholder="For example: BookLover"
                maxlength="60"
                required
              />
            </div>

            <button id="saveProfile" type="submit" class="btn btn-primary">
              Save changes
            </button>
            <button id="cancelEdit" type="button" class="btn btn-outline-secondary">
              Cancel
            </button>
          </fieldset>
        </form>

        <p id="profileMessage" class="mt-3 mb-0" role="status" aria-live="polite">
          Loading your profile…
        </p>
      </section>

      <!-- Everything below hides while your full profile or the edit form is open -->
      <div id="profileExtras">
      <!-- Favorite books -->
      <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
        <h2 class="h5 mb-3">Favorites</h2>

        <div class="d-flex flex-nowrap gap-4 overflow-auto pb-2">
          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 1</p>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 2</p>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 3</p>
          </div>
        </div>
      </section>
      <!-- Book lists -->
      <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
        <h2 class="h5 mb-3">Lists</h2>

        <div class="d-flex flex-nowrap gap-4 overflow-auto pb-2">
          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 1</p>
            <small>31 books</small>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 2</p>
            <small>12 books</small>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 3</p>
            <small>8 books</small>
          </div>
        </div>
      </section>
      <a href="./reviews.html?mine=1" class="btn bg-secondary-subtle rounded-pill w-100 mt-4">My reviews</a>
      </div>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
