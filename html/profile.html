<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/profile.js"></script>
  </head>

  <body>
    <main class="container py-5">
      <!-- Profile information -->
<!-- Profile information -->
<section class="bg-secondary-subtle rounded-4 p-3">
  <div class="d-flex align-items-center gap-4">
    <i
      class="bi bi-person-circle display-1 text-secondary"
      aria-hidden="true"
    ></i>

    <div>
      <h1 id="profileName" class="h4">My profile</h1>
      <p id="profileEmail" class="mb-0 text-break"></p>
    </div>
  </div>

  <form id="profileForm" class="mt-4">
    <fieldset id="profileFields" disabled>
      <legend class="h5">Edit your details</legend>

      <div class="mb-3">
        <label for="nameInput" class="form-label">Name</label>
        <input
          type="text"
          id="nameInput"
          class="form-control"
          autocomplete="name"
          maxlength="100"
          required
        />
      </div>

      <div class="mb-3">
        <label for="countryInput" class="form-label">Country</label>
        <input
          type="text"
          id="countryInput"
          class="form-control"
          autocomplete="country-name"
          maxlength="100"
          required
        />
      </div>

      <div class="mb-3">
        <label for="identityInput" class="form-label">Reader identity</label>
        <input
          type="text"
          id="identityInput"
          class="form-control"
          placeholder="For example: BookLover"
          maxlength="60"
          required
        />
      </div>

      <button id="saveProfile" type="submit" class="btn btn-primary">
        Save changes
      </button>
    </fieldset>

    <p id="profileMessage" class="mt-3 mb-0" role="status" aria-live="polite">
      Loading your profile…
    </p>
  </form>
</section>
      <!-- Favorite books -->
      <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
        <h2 class="h5 mb-3">Favorites</h2>

        <div class="d-flex flex-nowrap gap-4 overflow-auto pb-2">
          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 1</p>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 2</p>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="bg-light mb-2" style="width: 65px; height: 85px"></div>
            <p class="mb-0">Book 3</p>
          </div>
        </div>
      </section>
      <!-- Book lists -->
      <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
        <h2 class="h5 mb-3">Lists</h2>

        <div class="d-flex flex-nowrap gap-4 overflow-auto pb-2">
          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 1</p>
            <small>31 books</small>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 2</p>
            <small>12 books</small>
          </div>

          <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0">
            <div class="d-flex flex-wrap mb-2" style="width: 65px">
              <div class="bg-light" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-dark-subtle" style="width: 50%; height: 32px"></div>
              <div class="bg-light" style="width: 50%; height: 32px"></div>
            </div>
            <p class="mb-0">List 3</p>
            <small>8 books</small>
          </div>
        </div>
      </section>
      <button type="button" class="btn bg-secondary-subtle rounded-pill w-100 mt-4">My reviews</button>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
