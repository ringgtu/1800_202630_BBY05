<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile - Book App</title>

    <script type="module" src="/src/main.js"></script>

    <script type="module" src="/src/profile.js"></script>

  </head>

  <body class="profile-page">
    <main class="container py-5">
      <!-- Profile information -->
      <section id="profileCard" class="bg-secondary-subtle rounded-4 p-3">
        <!-- Back to the profile page (shown only when your full profile is open) -->
        <button
          id="backToProfile"
          type="button"
          class="btn btn-link back-link text-decoration-none px-0 mb-2"
          hidden
        >
          <i class="bi bi-chevron-left fs-2" aria-hidden="true"></i> Back
        </button>

        <div class="d-flex align-items-start justify-content-between gap-3">
          <!-- Select this to open your full profile -->
          <div
            id="profileSummary"
            class="d-flex align-items-center gap-4 flex-grow-1"
            role="button"
            tabindex="0"
            aria-label="Open my profile"
          >
            <i
              class="bi bi-person-circle display-1 text-secondary"
              aria-hidden="true"
            ></i>

            <div>
              <h1 id="profileName" class="h4">My profile</h1>
              <p id="profileEmail" class="mb-0 text-break"></p>
              <small id="profileHint" class="text-secondary" hidden>
                Select to view your profile
              </small>
            </div>
          </div>

          <i
            id="profileChevron"
            class="bi bi-chevron-right fs-3 text-secondary align-self-center"
            aria-hidden="true"
            hidden
          ></i>
          <button
            id="editProfile"
            type="button"
            class="btn btn-outline-primary btn-sm"
            hidden
          >
            Edit
          </button>
        </div>

        <!-- VIEW: all current info as plain text -->
        <div id="profileView" class="mt-4" hidden>
          <p class="mb-2">
            <strong>Name:</strong> <span id="viewName"></span>
          </p>
          <p class="mb-2">
            <strong>Country:</strong> <span id="viewCountry"></span>
          </p>
          <p class="mb-0">
            <strong>Reader identity:</strong> <span id="viewIdentity"></span>
          </p>
        </div>

        <!-- EDIT: same info, now editable -->
        <form id="profileForm" class="mt-4" hidden>
          <fieldset id="profileFields" disabled>
            <legend class="h5">Edit your details</legend>

            <div class="mb-3">
              <label for="nameInput" class="form-label">Name</label>
              <input
                type="text"
                id="nameInput"
                class="form-control"
                autocomplete="name"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label for="countryInput" class="form-label">Country</label>
              <input
                type="text"
                id="countryInput"
                class="form-control"
                autocomplete="country-name"
                maxlength="100"
                required
              />
            </div>

            <div class="mb-3">
              <label for="identityInput" class="form-label">Reader identity</label>
              <input
                type="text"
                id="identityInput"
                class="form-control"
                placeholder="For example: BookLover"
                maxlength="60"
                required
              />
            </div>

            <button id="saveProfile" type="submit" class="btn btn-primary">
              Save changes
            </button>
            <button id="cancelEdit" type="button" class="btn btn-outline-secondary">
              Cancel
            </button>
          </fieldset>
        </form>

        <p id="profileMessage" class="mt-3 mb-0" role="status" aria-live="polite">
          Loading your profile…
        </p>
      </section>

      <!-- Everything below hides while your full profile or the edit form is open -->
      <div id="profileExtras">
        <!-- Favorite books -->
        <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
          <h2 class="h5 mb-3">
          <a href="favorite_list.html" class="link-body-emphasis link-underline-opacity-0 link-underline-opacity-100-hover d-inline-flex align-items-center gap-2">
            Favorites <i class="bi bi-chevron-right" aria-hidden="true"></i>
          </a>
        </h2>
          <p id="favoritesMessage" class="mb-0" role="status"></p>

          <!-- profile.js fills this with the saved books -->
          <div id="favoritesList" class="d-flex flex-nowrap gap-4 overflow-auto pb-2"></div>

          <!-- Card template (never shown, only copied by profile.js) -->
          <template id="favorite-card-template">
            <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0 position-relative" style="width: 110px">
              <img
                src="/images/book.jpg"
                alt="Book cover"
                class="favorite-cover d-block mx-auto mb-2"
                style="width: 65px; height: 85px" />

              <a
                href="#"
                class="favorite-title stretched-link text-white text-decoration-none small"
                style="display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden"></a>
            </div>
          </template>
        </section>

        <!-- Book lists -->
        <section class="bg-secondary-subtle rounded-4 p-3 mt-4">
          <h2 class="h5 mb-3">
            <a href="lists.html" class="link-body-emphasis link-underline-opacity-0 link-underline-opacity-100-hover d-inline-flex align-items-center gap-2">
              Lists <i class="bi bi-chevron-right" aria-hidden="true"></i>
            </a>
          </h2>
          <p id="listsMessage" class="mb-0" role="status"></p>

          <div id="listsPreview" class="d-flex flex-nowrap gap-4 overflow-auto pb-2"></div>

          <!-- Card template -->
          <template id="list-preview-template">
            <div class="bg-secondary text-white rounded-4 p-3 text-center flex-shrink-0 position-relative" style="width: 110px">
              <!-- 2x2 picture: profile.js puts 4 cells in here -->
              <div
                class="list-covers d-grid mx-auto mb-2 overflow-hidden rounded-1"
                style="grid-template-columns: 1fr 1fr; width: 65px; height: 85px"></div>

              <a href="#" class="list-name stretched-link text-white text-decoration-none small d-block text-truncate"></a>
              <small class="list-count d-block"></small>
            </div>
          </template>
        </section>

        <a href="./reviews.html?mine=1" class="btn bg-secondary-subtle rounded-pill w-100 mt-4">My reviews</a>
      </div>
    </main>

    <site-navbar></site-navbar>

    <!-- The shared palette. It is the LAST thing on the page, so it always wins over Bootstrap. -->
    <link rel="stylesheet" href="/styles/style.css" />
  </body>
</html>
