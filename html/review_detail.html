<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/reviewDetail.js"></script>
  </head>

  <body>
    <main class="container py-4">
      <a href="./reviews.html" class="text-dark d-inline-block mb-3" aria-label="Back to reviews">
        <i class="bi bi-chevron-left fs-2" aria-hidden="true"></i>
      </a>

      <p id="detailMessage" class="text-secondary" role="status" aria-live="polite">
        Loading review…
      </p>

      <article id="detailReview" class="bg-secondary-subtle rounded-4 p-4" hidden>
        <div class="d-flex align-items-start justify-content-between gap-3 mb-3">
          <div class="d-flex gap-3 align-items-center">
            <div id="detailCover"></div>
            <div>
              <h1 id="detailBook" class="h3 text-break"></h1>
              <div id="detailStars" class="fs-5"></div>
              <div id="detailMeta" class="text-secondary"></div>
            </div>
          </div>

          <!-- Top right: shown only to the person who wrote the review -->
          <button id="editReview" type="button" class="btn btn-outline-primary btn-sm" hidden>
            Edit
          </button>
        </div>

        <!-- Reading the review -->
        <p id="detailComment" class="fs-5 text-break mb-0" style="white-space: pre-wrap"></p>

        <!-- Editing the review -->
        <form id="editForm" hidden>
          <fieldset id="editFields">
            <span class="form-label d-block" id="editRatingLabel">Rating</span>
            <div id="editStars" role="group" aria-labelledby="editRatingLabel" class="mb-3"></div>

            <label for="editComment" class="form-label">Comment</label>
            <textarea
              id="editComment"
              class="form-control mb-3"
              rows="8"
              maxlength="2000"
              required
            ></textarea>

            <div class="d-flex flex-wrap gap-2">
              <button id="saveEdit" type="submit" class="btn btn-primary">Save changes</button>
              <button id="cancelEdit" type="button" class="btn btn-outline-secondary">Cancel</button>
              <button id="deleteReview" type="button" class="btn btn-outline-danger ms-auto">
                Delete review
              </button>
            </div>
          </fieldset>
        </form>

        <p id="actionMessage" class="mt-3 mb-0" role="status" aria-live="polite"></p>
      </article>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
