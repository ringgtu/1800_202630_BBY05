<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reviews - Book App</title>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/reviews.js"></script>
  </head>

  <body>
    <main class="container py-4">
      <a id="backLink" href="./library.html" class="text-dark d-inline-block mb-3" aria-label="Back">
        <i class="bi bi-chevron-left fs-2" aria-hidden="true"></i>
      </a>

      <div class="input-group input-group-lg mb-4">
        <span class="input-group-text bg-secondary-subtle border-0">
          <i class="bi bi-search" aria-hidden="true"></i>
        </span>
        <input
          id="reviewsSearch"
          type="search"
          class="form-control bg-secondary-subtle border-0"
          placeholder="Search reviews"
          aria-label="Search reviews"
        />
      </div>

      <a
        href="./add_review.html"
        class="btn bg-secondary-subtle rounded-4 w-100 d-flex justify-content-between align-items-center fs-4 py-3 mb-4"
      >
        <span>Add reviews</span>
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </a>

      <h1 id="reviewsHeading" class="h4 text-uppercase mb-3">Reviews</h1>
      <p id="reviewsMessage" class="text-secondary" role="status" aria-live="polite">
        Loading reviews…
      </p>
      <div id="reviewsList" class="d-flex flex-column gap-3"></div>
    </main>

    <site-navbar></site-navbar>
  </body>
</html>
