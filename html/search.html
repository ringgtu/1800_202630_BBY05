<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search</title>

  <script type="module" src="/src/main.js"></script>
  <link rel="stylesheet" href="/styles/style.css">
  <script type="module" src="/src/display.js"></script>

</head>

<body>
  <!-- Each page's content goes here. -->
  <main class="container py-4">
    <div class="row justify-content-center">

      <form action="filtered.html">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-secondary-subtle border-0" id="basic-addon1">
            <i class="bi bi-search fs-4"></i>
          </span>

            <input
              type="text"
              id="search-input"
              name="q"
              class="form-control bg-secondary-subtle border-0"
              placeholder="Search books"
              aria-label="Search books"
              aria-describedby="basic-addon1" 
            />

        </div>
      </form>

      <div class="d-flex gap-3 mt-3">
        <a class="btn btn-secondary btn-lg flex-fill flex-md-grow-0 px-md-4" href="sort.html" data-keep-params role="button">
          Sort <i class="bi bi-filter-right fs-5 ms-2"></i>
        </a>
        <a class="btn btn-secondary btn-lg flex-fill flex-md-grow-0 px-md-4" href="filter.html" data-keep-params role="button">
          Filter <i class="bi bi-filter fs-5 ms-2"></i>
        </a>
      </div>
   </div>

   <br><br>
   
    <h2 class="h4 mb-3" id="results-heading">Loading...</h2>
    <br>


    <div class="row row-cols-1 row-cols-lg-2 g-4" id="results"></div>

    <!-- Book card template  -->
    <template id="book-card-template">
      <div class="col">
        <div class="card border-0 mb-4">
          <div class="row g-3">
            <div class="col-4 col-md-3">
              <img src="/images/book.jpg" class="img-fluid rounded book-cover" alt="Book cover" />
            </div>

            <div class="col-8 col-md-9">
              <div class="d-flex justify-content-between align-items-start">
                <div class="d-flex flex-wrap align-items-center gap-2 book-tags">
                  <h3 class="h5 mb-0 me-2">
                    <a href="book_info.html" class="book-title text-body text-decoration-none stretched-link">Book</a>
                  </h3>

                </div>
                <button class="btn btn-link text-body p-0 fs-4 position-relative z-2 fav-btn" type="button" aria-label="Favorite">
                  <i class="bi bi-heart"></i>
                </button>
              </div>

              <p class="mt-2 mb-0 book-desc"></p>
            </div>
          </div>
        </div>
      </div>
    </template>
  </main>

    <site-navbar></site-navbar>
</body>
</html>
